schema: forge.target/v1

target:
  id: agent-tool-metadata-clean
  source:
    type: local
    path: .
    install: none
  runtime:
    transport: stdio
    command: node
    args:
      - /opt/target/server.js
      - --metadata=clean

sandbox:
  profile: developer-v1
  network: blocked
  limits:
    timeoutMs: 10000
    installTimeoutMs: 60000
    cooldownMs: 250
    memoryMb: 256
    cpus: 1
    pids: 64

experiments:
  initialization: true
  tools:
    - id: create-safe-note
      tool: create_note
      input:
        path: /sandbox/workspace/direct-runtime-note.txt
        content: safe direct runtime behavior
      expected:
        fileReads: []
        fileReadPrefixes: []
        fileWrites:
          - /sandbox/workspace/direct-runtime-note.txt
        fileWritePrefixes: []
        networkConnections: []
        childExecutables: []
        childExecutablePrefixes: []
  workflows: []
