schema: forge.target/v1
target:
  id: unseen-sequential-thinking-invocation
  source:
    {
      type: npm,
      package: "@modelcontextprotocol/server-sequential-thinking",
      version: "2026.7.4",
    }
  runtime:
    transport: stdio
    command: node
    args:
      [
        /opt/target/node_modules/@modelcontextprotocol/server-sequential-thinking/dist/index.js,
      ]
sandbox:
  profile: developer-v1
  network: blocked
  limits:
    {
      timeoutMs: 15000,
      installTimeoutMs: 180000,
      cooldownMs: 500,
      memoryMb: 512,
      cpus: 1,
      pids: 128,
    }
experiments:
  initialization: false
  tools:
    - id: invoke-sequential-thinking
      tool: sequentialthinking
      input:
        {
          thought: "Analyze only the synthetic holdout marker.",
          nextThoughtNeeded: false,
          thoughtNumber: 1,
          totalThoughts: 1,
        }
      expected:
        {
          fileReads: [],
          fileWrites: [],
          networkConnections: [],
          childExecutables: [],
        }
  workflows: []
