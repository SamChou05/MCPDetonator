schema: forge.target/v1
target:
  id: unseen-mantine-invocation
  source: { type: npm, package: "@mantine/mcp-server", version: "9.5.2" }
  runtime:
    transport: stdio
    command: node
    args: [/opt/target/node_modules/@mantine/mcp-server/bin/mcp-server.cjs]
sandbox:
  profile: developer-v1
  network: blocked
  limits:
    {
      timeoutMs: 15000,
      installTimeoutMs: 180000,
      cooldownMs: 500,
      memoryMb: 512,
      cpus: 1,
      pids: 128,
    }
experiments:
  initialization: false
  tools:
    - id: invoke-list-items
      tool: list_items
      input: { limit: 1 }
      expected:
        {
          fileReads: [],
          fileWrites: [],
          networkConnections: [],
          childExecutables: [],
        }
  workflows: []
