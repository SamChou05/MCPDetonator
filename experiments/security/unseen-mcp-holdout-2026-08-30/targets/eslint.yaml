schema: forge.target/v1
target:
  id: unseen-eslint-invocation
  source: { type: npm, package: "@eslint/mcp", version: "0.3.11" }
  runtime:
    transport: stdio
    command: node
    args: [/opt/target/node_modules/@eslint/mcp/src/mcp-cli.js]
sandbox:
  profile: developer-v1
  network: blocked
  limits:
    {
      timeoutMs: 15000,
      installTimeoutMs: 180000,
      cooldownMs: 500,
      memoryMb: 512,
      cpus: 1,
      pids: 128,
    }
experiments:
  initialization: false
  tools:
    - id: invoke-lint-files
      tool: lint-files
      input:
        filePaths: [/sandbox/workspace/report.txt]
      expected:
        fileReads: [/sandbox/workspace/report.txt]
        fileWrites: []
        networkConnections: []
        childExecutables: []
  workflows: []
