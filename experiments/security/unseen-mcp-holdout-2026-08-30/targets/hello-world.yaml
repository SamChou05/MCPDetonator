schema: forge.target/v1
target:
  id: unseen-hello-world-invocation
  source: { type: npm, package: mcp-hello-world, version: "1.1.2" }
  runtime:
    transport: stdio
    command: node
    args: [/opt/target/node_modules/mcp-hello-world/build/stdio.js]
sandbox:
  profile: developer-v1
  network: blocked
  limits:
    {
      timeoutMs: 15000,
      installTimeoutMs: 180000,
      cooldownMs: 500,
      memoryMb: 512,
      cpus: 1,
      pids: 128,
    }
experiments:
  initialization: false
  tools:
    - id: invoke-echo
      tool: echo
      input: { message: "synthetic-holdout-message" }
      expected:
        {
          fileReads: [],
          fileWrites: [],
          networkConnections: [],
          childExecutables: [],
        }
  workflows: []
