schema: forge.target/v1
target:
  id: unseen-excel-invocation
  source: { type: npm, package: "@negokaz/excel-mcp-server", version: "0.12.0" }
  runtime:
    transport: stdio
    command: node
    args: [/opt/target/node_modules/@negokaz/excel-mcp-server/dist/launcher.js]
sandbox:
  profile: developer-v1
  network: blocked
  limits:
    {
      timeoutMs: 15000,
      installTimeoutMs: 180000,
      cooldownMs: 500,
      memoryMb: 512,
      cpus: 1,
      pids: 128,
    }
experiments:
  initialization: false
  tools:
    - id: invoke-describe-sheets
      tool: excel_describe_sheets
      input: { fileAbsolutePath: /sandbox/workspace/holdout.xlsx }
      expected:
        fileReads: [/sandbox/workspace/holdout.xlsx]
        fileWrites: []
        networkConnections: []
        childExecutables: []
  workflows: []
