schema: forge.target/v1

target:
  id: unseen-sequential-thinking
  source:
    type: npm
    package: "@modelcontextprotocol/server-sequential-thinking"
    version: "2026.7.4"
  runtime:
    transport: stdio
    command: node
    args:
      - /opt/target/node_modules/@modelcontextprotocol/server-sequential-thinking/dist/index.js

sandbox:
  profile: developer-v1
  network: blocked
  limits:
    timeoutMs: 10000
    installTimeoutMs: 120000
    cooldownMs: 0
    memoryMb: 192
    cpus: 1
    pids: 32

experiments:
  initialization: false
  tools:
    - id: one-synthetic-thought
      tool: sequentialthinking
      input:
        thought: "Evaluate the synthetic arithmetic probe 7 plus 5."
        nextThoughtNeeded: false
        thoughtNumber: 1
        totalThoughts: 1
      expected:
        fileReads: []
        fileWrites: []
        networkConnections: []
        childExecutables: []
  workflows: []
